name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main

  workflow_run:
    workflows:
      - "Terraform - Provision EKS"
    types:
      - completed

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: main-eks-cluster
  K8S_NAMESPACE: tic-tac-toe

jobs:
  # --------------------------------------------------
  # 1. Unit Testing
  # --------------------------------------------------
  test:
    name: Unit Testing
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # --------------------------------------------------
  # 2. Static Code Analysis
  # --------------------------------------------------
  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # --------------------------------------------------
  # 3. Build Application
  # --------------------------------------------------
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          if-no-files-found: error

  # --------------------------------------------------
  # 4. Build, Scan and Push Docker Image to ECR
  # Runs only after successful Terraform workflow on main
  # --------------------------------------------------
  docker:
    name: Docker Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Validate configuration
        run: |
          test -n "$AWS_REGION" || {
            echo "AWS_REGION repository variable is missing"
            exit 1
          }

          test -n "$ECR_REPOSITORY" || {
            echo "ECR_REPOSITORY repository variable is missing"
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image details
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "image_tag=sha-${SHA}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${REGISTRY}/${REPOSITORY}:sha-${SHA}" \
            >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          docker build -t "$IMAGE_URI" .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image.outputs.image_uri }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push Docker image to ECR
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          docker push "$IMAGE_URI"

  # --------------------------------------------------
  # 5. Deploy Application to EKS Fargate
  # --------------------------------------------------
  deploy:
    name: Deploy to EKS Fargate
    runs-on: ubuntu-latest
    needs: [docker]
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    concurrency:
      group: tic-tac-toe-eks-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.accessConfig'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify EKS access
        run: |
          kubectl get namespace

          kubectl auth can-i create deployments \
            --namespace "$K8S_NAMESPACE"

      - name: Create application namespace
        run: |
          kubectl create namespace "$K8S_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate Kubernetes manifests
        run: |
          test -f kubernetes/deployment.yaml
          test -f kubernetes/service.yaml
          test -f kubernetes/ingress.yaml

      - name: Update deployment image
        env:
          IMAGE_URI: ${{ needs.docker.outputs.image_uri }}
        run: |
          test -n "$IMAGE_URI" || {
            echo "ERROR: Docker image URI is empty"
            exit 1
          }

          sed -E \
            "s|^([[:space:]]*image:[[:space:]]*).*$|\1${IMAGE_URI}|" \
            kubernetes/deployment.yaml > /tmp/deployment.yaml

          echo "Deploying image: $IMAGE_URI"
          grep -n 'image:' /tmp/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f /tmp/deployment.yaml
          kubectl apply -f kubernetes/ingress.yaml

      - name: Wait for application rollout
        run: |
          kubectl rollout status deployment/tic-tac-toe \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m

      - name: Show deployment status
        if: always()
        run: |
          kubectl get deployments,pods,services,ingress \
            --namespace "$K8S_NAMESPACE" || true

          kubectl get ingress tic-tac-toe-ingress \
            --namespace "$K8S_NAMESPACE" || true

      # ------------------------------------------------
      # 6. Diagnose application connectivity
      # Runs even if rollout or an earlier deploy step fails
      # ------------------------------------------------
      - name: Diagnose Application Connectivity
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n "$K8S_NAMESPACE" -o wide || true

          echo "=== Service details ==="
          kubectl get svc tic-tac-toe \
            -n "$K8S_NAMESPACE" -o yaml || true

          kubectl describe svc tic-tac-toe \
            -n "$K8S_NAMESPACE" || true

          echo "=== Application logs ==="
          kubectl logs deployment/tic-tac-toe \
            -n "$K8S_NAMESPACE" --tail=100 || true

          echo "=== EndpointSlices ==="
          kubectl get endpointslice \
            -n "$K8S_NAMESPACE" || true

          echo "=== Ingress details ==="
          kubectl describe ingress tic-tac-toe-ingress \
            -n "$K8S_NAMESPACE" || true

          echo "=== AWS Load Balancer Controller ==="
          kubectl get deployment -A \
            | grep aws-load-balancer-controller || true
